<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Globe's Arcade: six retro 8-bit browser games on a curved CRT screen.">
<title>Globe's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=VT323&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<style>
*, *::before, *::after { box-sizing: border-box; }
body, h1, h2, p, ul { margin: 0; }
[hidden] { display: none !important; }

/* Layout: one curved TV tube fills the window. A pixel galaxy sits behind the header and the footer,
   the game slots sit on plain black between them. Games open in a full-tube overlay. Single dark look on purpose. */
:root {
  color-scheme: dark;
  --black: #000;
  --tube: #020302;        /* dead glass around the picture */
  --white: #f4f7f2;
  --green: #39ff7a;       /* phosphor green */
  --green-dim: #1c8a44;
  --green-deep: #0b3d1f;
  --red: #ff3d3d;         /* lives */
  --gold: #ffd23f;        /* winner */
  --orange: #ff8a1f;      /* explosions */
  --display: "Audiowide", "Arial Black", sans-serif;
  --mono: "VT323", "Courier New", monospace;
}
html, body { height: 100%; overflow: hidden; background: var(--tube); color: var(--white); }
/* An arcade, not a document: no text selection, callout menu or double-tap zoom when tapping fast. */
html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body { font: 1.35rem/1.35 var(--mono); }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
.defs { position: absolute; width: 0; height: 0; }

/* ---------- Tube ---------- */
.crt { position: fixed; inset: 0; overflow: hidden; border-radius: 4vmin; background: var(--black); }
.crt.warp { filter: url(#warp); }
.scan, .vig { position: absolute; inset: 0; pointer-events: none; z-index: 5; border-radius: inherit; }
/* Bright line, then a darker line in between: the box TV look */
.scan { background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .035) 0 2px, rgba(0, 0, 0, .42) 2px 4px); }
.vig { box-shadow: inset 0 0 16vmin rgba(0, 0, 0, .85), inset 0 0 3vmin rgba(0, 0, 0, .7); }
#flash { position: absolute; inset: 0; z-index: 6; background: var(--white); opacity: 0; pointer-events: none; }
#flash.go { animation: flash .34s steps(1, end); }
@keyframes flash { 0% { opacity: .95; } 34% { opacity: .5; } 67% { opacity: .18; } 100% { opacity: 0; } }
.scroll {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; outline: none;
  scrollbar-width: thin; scrollbar-color: var(--green-dim) transparent;
  display: flex; flex-direction: column;
}
.wrap {
  position: relative; width: 100%; max-width: 1040px; margin-inline: auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.sky { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }

/* ---------- Header ---------- */
header { position: relative; padding-block: clamp(90px, 16vh, 150px) clamp(44px, 8vh, 80px); text-align: center; }
.title-box { position: relative; display: inline-block; padding: 12px 18px; max-width: 100%; }
h1 {
  font: clamp(2rem, 8.4vw, 5.6rem)/1.05 var(--display); letter-spacing: .03em; text-wrap: balance;
  color: var(--white);
  text-shadow: 4px 4px 0 var(--green-dim), 0 0 18px rgba(57, 255, 122, .45);
}
.pstar { position: absolute; width: 21px; height: 21px; pointer-events: none; animation: blink var(--d, 6s) steps(1, end) infinite; animation-delay: var(--delay, 0s); }
.pstar svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
.pstar.sm { width: 12px; height: 12px; }
@keyframes blink {
  0% { opacity: 1; transform: scale(1); }
  25% { opacity: .55; transform: scale(.6); }
  50% { opacity: 0; transform: scale(.6); }
  75% { opacity: .55; transform: scale(.6); }
}

/* ---------- Game slots ---------- */
main { padding-block: 32px 72px; background: var(--black); }
.label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--green); letter-spacing: .14em; text-transform: uppercase; font-size: 1.25rem; }
.label span:last-child { color: var(--white); opacity: .7; }
.slots { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 2.6vw, 28px); }
.slot {
  position: relative; aspect-ratio: 4 / 3; max-width: 100%;
  border: 3px solid var(--white); background: var(--black);
  box-shadow: 5px 5px 0 var(--green-deep);
}
.slot b { position: absolute; left: 10px; top: 6px; font-weight: 400; color: var(--green-dim); letter-spacing: .1em; font-variant-numeric: tabular-nums; pointer-events: none; }
.slot-btn ~ b, .slot-btn .name { background: var(--black); padding-inline: 5px; line-height: 1.1; }
.slot-btn ~ b { color: var(--green); }
.slot-btn {
  position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: none; border: 0; color: inherit;
}
.slot-btn canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.slot-btn .name { position: absolute; left: 10px; bottom: 6px; color: var(--green); letter-spacing: .14em; }
.slot:has(.slot-btn:hover) { border-color: var(--green); }
@media (max-width: 640px) { .slots { grid-template-columns: 1fr; } }

/* ---------- Footer ---------- */
footer { position: relative; margin-top: auto; border-top: 3px solid var(--white); padding-block: 34px 54px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: center; justify-content: space-between; }
footer .brand { font: 1.1rem/1 var(--display); color: var(--green); letter-spacing: .04em; }
footer ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; }
footer a { color: var(--white); text-decoration: none; }
footer a:hover { color: var(--green); }
footer p { color: var(--white); opacity: .65; }

/* ---------- Game overlay ---------- */
#game { position: absolute; inset: 0; z-index: 4; background: var(--black); touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
#pin { position: absolute; left: 0; top: 0; image-rendering: pixelated; touch-action: none; }
#exit {
  position: absolute; z-index: 1; cursor: pointer; min-height: 36px; padding: 2px 12px;
  top: calc(5vmin + env(safe-area-inset-top, 0px)); right: calc(5vmin + env(safe-area-inset-right, 0px));
  background: var(--black); color: var(--white); border: 2px solid var(--white); letter-spacing: .1em;
}
#exit:hover { color: var(--green); border-color: var(--green); }
#exit.left { right: auto; left: calc(5vmin + env(safe-area-inset-left, 0px)); }
#exit.troll { right: auto; color: var(--red); border-color: var(--red); box-shadow: 3px 3px 0 #5a0d0d; }
#exit.troll:hover { color: var(--white); border-color: var(--white); }
#exit.appear { animation: exitPop .3s steps(3, end); }
@keyframes exitPop { 0% { transform: scale(.3); } 34% { transform: scale(1.25); } 67% { transform: scale(.9); } 100% { transform: none; } }
.prompt {
  position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); width: min(calc(100% - 32px), 380px);
  bottom: calc(7vmin + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 8px; padding: 10px 12px 12px; text-align: center;
  background: var(--black); border: 3px solid var(--white); box-shadow: 5px 5px 0 var(--green-deep);
}
.prompt.pop { animation: pop .25s steps(3, end); }
@keyframes pop { 0% { transform: translateX(-50%) scale(.4); } 34% { transform: translateX(-50%) scale(1.08); } 67% { transform: translateX(-50%) scale(.97); } 100% { transform: translateX(-50%); } }
.p-title { color: var(--green); letter-spacing: .14em; font-size: 1.4rem; line-height: 1.1; }
.p-note { font-size: 1.1rem; line-height: 1.15; opacity: .85; text-wrap: balance; }
.p-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.p-btns.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.p-btns.grid .wide { grid-column: span 3; }
.p-btns button {
  min-height: 40px; min-width: 44px; padding: 2px 10px; cursor: pointer; letter-spacing: .06em;
  background: var(--black); color: var(--white); border: 2px solid var(--white);
}
.p-btns button:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.p-btns button.red { background: #b81c1c; border-color: #ff7b7b; }
.p-btns button.black { background: #141414; }
.p-btns button.green { background: #0f7a35; border-color: var(--green); }
.p-btns button.gold { color: var(--gold); border-color: var(--gold); }
.p-btns button.red:hover:not(:disabled), .p-btns button.black:hover:not(:disabled), .p-btns button.green:hover:not(:disabled) { color: var(--white); border-color: var(--gold); }
.p-btns button:disabled { opacity: .3; cursor: default; }
#hint {
  position: absolute; left: 0; right: 0; bottom: calc(4vmin + env(safe-area-inset-bottom, 0px)); text-align: center;
  color: var(--green); font-size: 1.1rem; letter-spacing: .06em; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

@media (prefers-reduced-motion: reduce) { .pstar { animation: none; } }
</style>

<svg class="defs" aria-hidden="true">
  <filter id="warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="warpMap" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap id="warpDisp" in="SourceGraphic" in2="map" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="crt" id="crt">
  <div class="scroll" id="scroll" tabindex="0">
    <header id="top">
      <canvas class="sky" id="skyTop" aria-hidden="true"></canvas>
      <div class="wrap">
        <div class="title-box" id="titleBox">
          <h1>Globe's Arcade</h1>
        </div>
      </div>
    </header>

    <main>
      <div class="wrap">
        <p class="label"><span>Select a game</span><span>6 slots</span></p>
        <ul class="slots" aria-label="Games">
          <li class="slot">
            <button class="slot-btn" id="pinballBtn" type="button" aria-label="Play Pinball">
              <canvas id="pinIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">PINBALL</span>
            </button>
            <b>01</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="plinkoBtn" type="button" aria-label="Play Plinko">
              <canvas id="plinkoIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">PLINKO</span>
            </button>
            <b>02</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="raidBtn" type="button" aria-label="Play Star Raid">
              <canvas id="raidIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">STAR RAID</span>
            </button>
            <b>03</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="rallyBtn" type="button" aria-label="Play Rally">
              <canvas id="rallyIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">RALLY</span>
            </button>
            <b>04</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="hockeyBtn" type="button" aria-label="Play Air Hockey">
              <canvas id="hockeyIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">AIR HOCKEY</span>
            </button>
            <b>05</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="rouletteBtn" type="button" aria-label="Play Roulette. Tap three times to break the glass.">
              <canvas id="rouletteIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">ROULETTE</span>
            </button>
            <b>06</b>
          </li>
        </ul>
      </div>
    </main>

    <footer id="foot">
      <canvas class="sky" id="skyBot" aria-hidden="true"></canvas>
      <div class="wrap">
        <span class="brand">Globe's Arcade</span>
        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">Credits</a></li>
        </ul>
        <p>Footer placeholder. &copy; 2026</p>
      </div>
    </footer>
  </div>

  <div id="game" hidden tabindex="-1" role="application" aria-label="Pinball">
    <canvas id="pin" aria-hidden="true"></canvas>
    <button id="exit" type="button" hidden>EXIT</button>
    <p id="hint" hidden></p>
    <div id="prompt" class="prompt" hidden aria-live="polite">
      <p class="p-title" id="pTitle"></p>
      <p class="p-note" id="pNote"></p>
      <div class="p-btns" id="pBtns"></div>
    </div>
  </div>

  <div class="scan"></div>
  <div class="vig"></div>
  <div id="flash"></div>
</div>

<script>
(() => {
  const CONFIG = {
    curve: 0.07,        // screen curvature
    px: 3,              // size of one galaxy pixel in CSS pixels
    fps: 8,             // galaxy frame rate (star blinks, Saturn's ring)
    cometFps: 14,       // galaxy frame rate while a comet is crossing
    cometEvery: 30,     // seconds between comets
    animFps: 12,        // game open and close animations
    playFps: 30,        // pinball while playing
    lives: 4,
    winScore: 5000,     // Plinko points needed for the WINNER screen
  };
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { white: css("--white"), green: css("--green"), dim: css("--green-dim"), deep: css("--green-deep"), red: css("--red"), gold: css("--gold"), orange: css("--orange"), amber: "#fff3a0", ember: "#5a2a08", black: "#000", grey: "#8b938a", dark: "#3c423b" };
  const crt = $("crt");
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

  // ---- Curved glass: an SVG displacement map bends the whole tube ----
  const safari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  function buildWarp() {
    if (safari) return; // Safari's url() filters are unreliable on HTML; it keeps the rounded tube and vignette.
    const W = innerWidth, H = innerHeight, N = 256, MH = Math.max(32, Math.round(N * H / W));
    const scale = 2 * Math.max(W, H) * CONFIG.curve * 0.55;
    const c = mk(N, MH), x = c.getContext("2d"), img = x.createImageData(N, MH);
    for (let j = 0, i = 0; j < MH; j++) for (let k = 0; k < N; k++, i += 4) {
      const px = (k + .5) / N * 2 - 1, py = (j + .5) / MH * 2 - 1;
      img.data[i] = 127.5 + 255 * (px * CONFIG.curve * py * py * W / 2) / scale;
      img.data[i + 1] = 127.5 + 255 * (py * CONFIG.curve * px * px * H / 2) / scale;
      img.data[i + 2] = 128; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    $("warpMap").setAttribute("href", c.toDataURL());
    $("warpDisp").setAttribute("scale", scale);
    crt.classList.add("warp");
  }

  // ---- 8-bit stars hugging the title ----
  const STAR = `<svg viewBox="0 0 7 7"><path fill="currentColor" d="M3 0h1v2h-1zM3 5h1v2h-1zM0 3h2v1h-2zM5 3h2v1h-2zM2 2h3v3h-3z"/></svg>`;
  function placeTitleStars() {
    const box = $("titleBox");
    // Spots just outside the letters, as % of the title box.
    const spots = [[-1, 8], [38, -10], [100, 2], [93, 104], [16, 100]];
    spots.forEach(([l, t], i) => {
      const s = document.createElement("i");
      s.className = "pstar" + (i % 2 ? " sm" : "");
      s.innerHTML = STAR;
      s.style.left = `calc(${l}% - 10px)`; s.style.top = `calc(${t}% - 10px)`;
      s.style.color = i % 3 === 0 ? C.green : C.white;
      s.style.setProperty("--d", (4.8 + (i * 37 % 10) * .6).toFixed(2) + "s");
      s.style.setProperty("--delay", (-(i * 53 % 17) * .45).toFixed(2) + "s");
      box.appendChild(s);
    });
  }

  // ---- Pixel galaxy behind the header and the footer ----
  let spin = 0;
  function makeSky(canvas, host, opts) {
    const s = { canvas, host, g: canvas.getContext("2d"), w: 0, h: 0, stars: [], comet: null, next: 0, sat: null, planet: null, ...opts };
    s.resize = () => {
      s.w = Math.max(1, Math.ceil(host.clientWidth / CONFIG.px)); s.h = Math.max(1, Math.ceil(host.clientHeight / CONFIG.px));
      canvas.width = s.w; canvas.height = s.h;
      const n = Math.min(90, Math.max(10, Math.round(s.w * s.h / 1260)));
      s.stars = Array.from({ length: n }, () => ({
        x: Math.floor(Math.random() * s.w), y: Math.floor(Math.random() * s.h),
        big: Math.random() < .14, green: Math.random() < .22,
        period: (6 + Math.floor(Math.random() * 18)) * 4, phase: Math.floor(Math.random() * 96),
      }));
      if (s.saturn) {
        const r = Math.max(7, Math.min(14, Math.round(Math.min(s.w * .03, s.h * .13))));
        s.sat = { r, x: s.w - Math.round(r * 2.5) - 6, y: Math.round(r * 1.5) + 8, tilt: -.38 };
        s.planet = paintPlanet(r, s.sat.tilt);
      }
      s.draw(performance.now() / 1000);
    };
    s.draw = (t) => {
      const g = s.g;
      g.fillStyle = C.black; g.fillRect(0, 0, s.w, s.h);
      const f = Math.floor(t * CONFIG.fps);
      for (const st of s.stars) {
        const step = (f + st.phase) % st.period;   // each star blinks on its own slow beat
        if (!reduced && step < 8) continue;         // off
        const dim = !reduced && step < 16;
        g.fillStyle = dim ? (st.green ? C.deep : "#5a6157") : (st.green ? C.green : C.white);
        g.fillRect(st.x, st.y, 1, 1);
        if (st.big && !dim) { g.fillRect(st.x - 1, st.y, 3, 1); g.fillRect(st.x, st.y - 1, 1, 3); }
      }
      if (s.comet) drawComet(s, t);
      if (s.sat) {
        drawRing(s, false);
        g.drawImage(s.planet, s.sat.x - s.sat.r, s.sat.y - s.sat.r);
        drawRing(s, true);
      }
    };
    return s;
  }

  // Saturn's body is drawn once: banded greens with a dithered shadow.
  function paintPlanet(r, tilt) {
    const c = mk(r * 2 + 1, r * 2 + 1), x = c.getContext("2d"), band = [C.green, C.dim, "#7dffad", C.dim, C.green, C.deep];
    const cos = Math.cos(-tilt), sin = Math.sin(-tilt);
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      if (i * i + j * j > r * r + r * .4) continue;
      const lat = (i * sin + j * cos) / r;
      const z = Math.sqrt(Math.max(0, 1 - (i * i + j * j) / (r * r)));
      const light = (-i * .55 - j * .45) / r + z * .8;
      let col = band[Math.floor((lat + 1) * 3.4) % band.length];
      if (light < .15 && (i + j) % 2 === 0) col = C.deep;
      if (light < -.15) col = (i + j) % 2 === 0 ? C.black : C.deep;
      x.fillStyle = col; x.fillRect(i + r, j + r, 1, 1);
    }
    return c;
  }
  // The ring is dots on tilted ellipses. Bright clumps travel around it as it spins.
  function drawRing(s, front) {
    const g = s.g, { r, x: cx, y: cy, tilt } = s.sat, ct = Math.cos(tilt), st = Math.sin(tilt);
    [1.42, 1.56, 1.7, 1.82, 2.04, 2.16, 2.26].forEach((k, ri) => {
      const R = r * k, steps = Math.ceil(Math.PI * 2 * R * 1.4);
      for (let i = 0; i < steps; i++) {
        const a = i / steps * Math.PI * 2, ly = Math.sin(a);
        if ((ly > 0) !== front) continue;
        const ex = Math.cos(a) * R, ey = ly * R * .3;
        const b = Math.sin(3 * (a - spin) + ri) + .6 * Math.sin(8 * (a - spin) + ri * 2);
        g.fillStyle = b > .9 ? C.white : b > -.2 ? (ri < 4 ? C.green : C.dim) : C.deep;
        g.fillRect(Math.round(cx + ex * ct - ey * st), Math.round(cy + ex * st + ey * ct), 1, 1);
      }
    });
  }
  function drawComet(s, t) {
    const g = s.g, c = s.comet, p = (t - c.start) / c.life;
    if (p >= 1) { s.comet = null; return; }
    const hx = Math.round(c.x0 + (c.x1 - c.x0) * p), hy = Math.round(c.y0 + (c.y1 - c.y0) * p);
    const dx = c.x1 - c.x0, dy = c.y1 - c.y0, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    for (let i = 1; i < 34; i++) {
      if (i > 18 && i % 2) continue;
      g.fillStyle = i < 6 ? C.white : i < 18 ? C.green : C.dim;
      g.fillRect(Math.round(hx - ux * i), Math.round(hy - uy * i), 1, 1);
    }
    g.fillStyle = C.white;
    g.fillRect(hx - 1, hy - 1, 2, 2);
    g.fillRect(hx - 3, hy, 1, 1); g.fillRect(hx + 2, hy - 1, 1, 1);
  }
  function launchComet(s, t) {
    const fromLeft = Math.random() < .5, y0 = Math.random() * s.h * .3;
    s.comet = { start: t, life: 2.4, x0: fromLeft ? -40 : s.w + 40, y0, x1: fromLeft ? s.w + 40 : -40, y1: y0 + s.h * (.3 + Math.random() * .3) };
  }

  const skies = [
    makeSky($("skyTop"), $("top"), { saturn: true, hasComet: true }),
    makeSky($("skyBot"), $("foot"), {}),
  ];
  const ro = new ResizeObserver(() => skies.forEach((s) => s.resize()));

  // =====================================================================
  //  PLINKO
  // =====================================================================
  const PLINKO = (() => {
    // Bottom slots, left to right. Negative numbers take hearts, positive numbers add points.
    const VALUES = [1500, -4, 100, -1, 50, 250, -3, 500];
    const X0 = 4, SW = 11, FLOOR = 156, DIV_TOP = 116, GRAV = 160;
    const PEGS = [];

    }
    const WALLS = [[4, 14, 4, FLOOR], [92, 14, 92, FLOOR]];
    // Little angled bumps on each wall push the ball back into the pegs, so the edges are not a free lane.
    const BUMPS = [26, 44, 62, 80, 98];
    for (const y of BUMPS) WALLS.push([4, y - 4, 10, y], [10, y, 4, y + 4], [92, y - 4, 86, y], [86, y, 92, y + 4]);
    for (let k = 1; k < 8; k++) WALLS.push([X0 + SW * k, DIV_TOP, X0 + SW * k, FLOOR]);
    const ball = { x: 48, y: 17, vx: 0, vy: 0, r: 2.5 };
    let live = false, dropX = 48, dir = 1, cool = 0, slotLit = -1, slotT = 0, endState = null, endT = 0, still = 0, lastX = 0, lastY = 0, fuse = -1;
    const FUSE = Math.round(2.5 * CONFIG.animFps); // the intro ball sits for 2.5 seconds before it explodes
    let showBoard = false, white = false, introY = null;
    const slotCol = (v) => v < 0 ? C.red : v >= 1500 ? C.gold : C.white;

    // ---- Board art, painted once ----
    const inBox = (x, y, x0, y0, x1, y1, r) => {
      if (x < x0 || x > x1 || y < y0 || y > y1) return false;
      const cx = Math.min(Math.max(x, x0 + r), x1 - r), cy = Math.min(Math.max(y, y0 + r), y1 - r);

    const inOuter = (x, y) => inBox(x, y, 0, 0, MW, MH, 9);

    const board = mk(MW, MH);
    function paintBoard() {
      const x = board.getContext("2d");
      for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
        const cx = i + .5, cy = j + .5;
        if (!inOuter(cx, cy)) continue;
        const rim = !inOuter(cx - 1, cy) || !inOuter(cx + 1, cy) || !inOuter(cx, cy - 1) || !inOuter(cx, cy + 1);
        let col;

        else if (!inField(cx, cy)) col = (i + j) % 4 === 0 ? C.dim : C.deep;
        else if (!inField(cx - 1, cy) || !inField(cx + 1, cy) || !inField(cx, cy - 1) || !inField(cx, cy + 1)) col = C.white;
        else if (j >= DIV_TOP) {
          const v = VALUES[Math.min(7, Math.floor((i - X0) / SW))];
          col = (i + j) % 2 ? "#030a05" : v < 0 ? "#2c0909" : v >= 1500 ? "#332705" : C.deep;
        } else col = i % 8 === 0 && j % 8 === 0 ? C.deep : "#030a05";
        x.fillStyle = col; x.fillRect(i, j, 1, 1);
      }
      line(x, 9, 8, 87, 8, C.dim);
      for (let k = 1; k < 8; k++) line(x, X0 + SW * k, DIV_TOP, X0 + SW * k, FLOOR, C.white);
      for (const y of BUMPS) for (const [w, t] of [[4, 10], [92, 86]]) {
        for (let j = -3; j <= 3; j++) { const reach = Math.round((t - w) * (1 - Math.abs(j) / 4)); line(x, w, y + j, w + reach, y + j, C.deep); }
        line(x, w, y - 4, t, y, C.white); line(x, t, y, w, y + 4, C.white);
      }

        const s = (v > 0 ? "+" : "") + v, cx = Math.round(X0 + SW * k + 5.5 - 1.5), y0 = FLOOR - 2 - s.length * 6;
        [...s].forEach((ch, i) => text(x, ch, cx, y0 + i * 6, slotCol(v)));

    }
    function shuffle() { // new slot order for every ball
      for (let i = VALUES.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [VALUES[i], VALUES[j]] = [VALUES[j], VALUES[i]]; }
      paintBoard();
    }
    shuffle();

    function drop() {
      if (live || cool > 0 || endState) return;
      Object.assign(ball, { x: dropX, y: 17, vx: (Math.random() - .5) * 6, vy: 0 });
      live = true; still = 0; lastX = ball.x; lastY = ball.y;
    }
    function substep(h) {
      ball.vy += GRAV * h;
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      for (const p of PEGS) if (hit(ball, p.x, p.y, 1.5, .5, 0, 0, 0)) { p.lit = .2; ball.vx += (Math.random() - .5) * 16; }
      for (const w of WALLS) { const [cx, cy] = closest(w[0], w[1], w[2], w[3], ball.x, ball.y); hit(ball, cx, cy, 0, .35, 0, 0, 0); }
      if (ball.y > FLOOR - ball.r) { ball.y = FLOOR - ball.r; if (ball.vy > 0) ball.vy *= -.25; ball.vx *= .7; }

    }
    function land() {
      const k = Math.max(0, Math.min(7, Math.floor((ball.x - X0) / SW))), v = VALUES[k];
      live = false; cool = 1.1; slotLit = k; slotT = 1;
      G.pops.push({ x: X0 + SW * k + 5.5, y: DIV_TOP - 8, txt: (v > 0 ? "+" : "") + v, life: 1, col: slotCol(v) });
      if (v < 0) { loseHearts(-v); if (G.lives <= 0) { endState = "over"; endT = 1.1; } }
      else { addScore(v); if (G.score >= CONFIG.winScore) { endState = "win"; endT = .9; } }
    }

    return {
      name: "PLINKO",
      lives: CONFIG.lives,
      hint: { touch: "Tap to drop the ball.", keys: "Press Space or click to drop the ball. Esc exits." },
      keys: ["Space", "Enter", "ArrowDown"],
      reset() {

        showBoard = false; white = false; introY = null; fuse = -1;
        shuffle();
        PEGS.forEach((p) => p.lit = 0);
      },
      stop() {},
      update(dt) {

        }

        slotT -= dt;
        for (const p of PEGS) p.lit -= dt;

      },
      key(code, down) { if (down) drop(); },
      press(side, on) { if (on) drop(); },
      // A ball drops in from the top, explodes on the bottom of the border, the inside flashes white, then the board appears in steam.
      enter(f) {
        const top = L.by - 14, bot = L.by + BH - 6, seq = [0, .08, .2, .38, .62, .9, 1], BOOM = 7 + FUSE;
        if (f <= 6) introY = top + (bot - top) * seq[f];

        if (fuse >= 0) G.parts.push({ k: "bit", x: L.bx + BW / 2 + (Math.random() - .5) * 2, y: bot - 5, vx: (Math.random() - .5) * 30, vy: -(20 + Math.random() * 30), s: 1, col: Math.random() < .5 ? C.gold : C.orange, gr: 60, life: 3 + Math.random() * 3 });
        if (f === BOOM) { introY = null; G.shake = 6; explode(L.bx + BW / 2, bot + 3); }

      },
      leave(f) {

        if (f === 3) { showBoard = false; G.steam = 0; for (let i = 0; i < 24; i++) G.parts.push({ k: "puff", x: L.bx + 6 + Math.random() * (BW - 12), y: L.by + 10 + Math.random() * (BH - 20), vx: (Math.random() - .5) * 20, vy: -(6 + Math.random() * 16), r: 2, grow: 5, life: 8 + Math.random() * 6, age: i, c1: C.white, c2: C.grey }); }

      },
    };
  })();

  // =====================================================================
  //  STAR RAID: an original fixed shooter
  // =====================================================================
  const RAID = (() => {
    const PAL = { W: C.white, G: C.green, D: C.dim, Y: C.gold, R: C.red, O: C.orange };
    // rot 1 turns a sprite to face right, rot -1 to face left
    function sprite(rows, rot = 0, tint) {

        if (ch === ".") return;
        x.fillStyle = tint || PAL[ch];
        if (rot === 1) x.fillRect(h - 1 - j, i, 1, 1);
        else if (rot === -1) x.fillRect(j, w - 1 - i, 1, 1);
        else x.fillRect(i, j, 1, 1);

      return c;
    }
    const SHIP = ["...W...", "...W...", "..WGW..", ".WWGWW.", "WWWWWWW", "W.WWW.W", "..O.O.."];

        ["..YYYYY..", ".YYYYYYY.", "YYRYYYRYY", "YYYYYYYYY", "Y.Y...Y.Y", ".Y.....Y."],
        ["..YYYYY..", ".YYYYYYY.", "YYRYYYRYY", "YYYYYYYYY", ".YY...YY.", "Y.......Y"]] },
      stinger: { pts: 80, rows: [
        ["W.....W", ".WWWWW.", "WWGWGWW", ".WWWWW.", "..W.W.."],
        [".W...W.", ".WWWWW.", "WWGWGWW", ".WWWWW.", ".W...W."]] },
      drone: { pts: 50, rows: [
        [".G...G.", "GGGGGGG", "GWGGGWG", "GGGGGGG", ".G.G.G."],
        [".G...G.", "GGGGGGG", "GWGGGWG", "GGGGGGG", "G.G.G.G"]] },
    };
    for (const T of Object.values(TYPES)) { T.c = T.rows.map((r) => sprite(r)); T.w = T.rows[0][0].length; T.h = T.rows[0].length; }
    const shipC = sprite(SHIP), shipDead = sprite(SHIP, 0, C.dark), shipR = sprite(SHIP, 1), shipL = sprite(SHIP, -1);
    const foeR = sprite(TYPES.warden.rows[0], 1), foeL = sprite(TYPES.warden.rows[0], -1);

    const PY = 148;
    let px = 48, en = [], pb = [], eb = [], wave = 1, t = 0, fy = 0, sway = 0, fireCool = 0, dead = 0, inv = 0, diveT = 2, fireT = 1.5, waveT = 0;
    let chase = null, reveal = null, touchFire = 0;

    const stars = Array.from({ length: 40 }, () => ({ x: Math.random() * MW, y: Math.random() * MH, v: 8 + Math.random() * 30 }));
    const CX = (v) => L.bx + PADX + v, CY = (v) => L.by + PADT + v;
    function boomC(x, y, n, cols) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 80;
        G.parts.push({ k: "bit", x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, s: Math.random() < .3 ? 2 : 1, col: cols[i % cols.length], gr: 0, life: 5 + Math.random() * 7 });
      }
    }
    const boom = (x, y, n, cols) => boomC(CX(x), CY(y), n, cols);

    function spawnWave(dropIn) {
      en = [];
      [["warden", 4, 16], ["stinger", 6, 27], ["drone", 7, 37], ["drone", 7, 47]].forEach(([type, n, y]) => {
        const x0 = 48 - (n - 1) * 5.5;
        for (let i = 0; i < n; i++) en.push({ type, hx: x0 + i * 11, hy: y, x: x0 + i * 11, y, mode: "form", t: 0 });
      });
      fy = dropIn ? -70 : 0; waveT = 1.8; diveT = 2.5; fireT = 2;
    }
    function hitPlayer() { dead = 1.4; loseHearts(1); eb = []; boom(px, PY, 30, [C.orange, C.gold, C.white, C.red]); }
    function stop() { held.l = held.r = held.fire = false; touchFire = 0; }

    function update(dt) {
      t += dt;
      for (const s of stars) { s.y += s.v * dt; if (s.y > MH) { s.y = 0; s.x = Math.random() * MW; } }
      const dir = (held.r ? 1 : 0) - (held.l ? 1 : 0);

        if (!dead) for (const e of en) if (e.mode !== "form" && e.mode !== "dead" && Math.abs(e.x - px) < 6 && Math.abs(e.y - PY) < 5) {

        }
      }
      en = en.filter((e) => e.mode !== "dead");
      inv -= dt;
      if (dead && (dead -= dt) <= 0) { dead = 0; if (G.lives > 0) { inv = 1.8; px = 48; } else { stop(); go("over"); } }
      waveT -= dt;

    }

    function drawGame(x, tx, ty) {
      for (const s of stars) rect(x, tx + s.x, ty + s.y, 1, 1, s.v > 25 ? C.white : C.dim);
      const fr = Math.floor(t * 3) % 2;

      for (const b of pb) { rect(x, tx + b.x, ty + b.y - 1, 1, 3, C.white); rect(x, tx + b.x, ty + b.y - 2, 1, 1, C.green); }

    }

    return {
      name: "STAR RAID",
      lives: 3,
      art: { ship: SHIP, foe: TYPES.warden.rows[0], small: TYPES.stinger.rows[0] },
      hint: { touch: "Hold the left or right side to move. Your ship fires while you hold.", keys: "Left and right arrows move. Space fires. Esc exits." },
      keys: ["ArrowLeft", "KeyA", "ArrowRight", "KeyD", "Space", "ArrowUp", "KeyZ", "KeyW"],

  // ---- Open and close sequence (12 frames a second) ----

    R(6, 22, 2, 8, C.white); R(24, 22, 2, 8, C.white); R(4, 29, 5, 1, C.white); R(23, 29, 5, 1, C.white);   // legs
    R(9, 1, 14, 11, C.white); R(10, 2, 12, 9, C.green); R(11, 3, 10, 7, C.black);                          // backbox
    R(13, 5, 1, 1, C.white); R(19, 4, 1, 1, C.white); R(17, 8, 1, 1, C.green); R(15, 6, 3, 1, C.white); R(16, 5, 1, 3, C.white);
    R(13, 12, 6, 2, C.dim);
    for (let y = 14; y <= 21; y++) {                                                                       // playfield at an angle
      const l = Math.round(8 - (y - 14) * 3 / 7), r = 31 - l;
      R(l, y, r - l + 1, 1, y === 14 || y === 21 ? C.white : C.black);
      R(l, y, 1, 1, C.white); R(r, y, 1, 1, C.white);
    }
    R(11, 16, 2, 1, C.green); R(19, 16, 2, 1, C.green); R(15, 17, 2, 1, C.green); R(18, 18, 1, 1, C.white);
    R(10, 19, 2, 1, C.white); R(12, 20, 2, 1, C.white); R(20, 19, 2, 1, C.white); R(18, 20, 2, 1, C.white); R(25, 17, 1, 3, C.green);
    R(5, 22, 22, 5, C.green); R(5, 26, 22, 1, C.white); R(13, 23, 6, 3, C.black); R(14, 24, 1, 1, C.red); R(17, 24, 1, 1, C.red);
  }, PINBALL, BG.pinball, [C.gold, C.dim]);

  makeIcon("plinkoBtn", "plinkoIcon", (R) => {
    R(5, 1, 22, 29, C.white); R(6, 2, 20, 27, C.black);                // board frame
    R(8, 4, 16, 1, C.dim); R(14, 5, 4, 1, C.white);                    // rail and dropper
    R(15, 7, 2, 2, C.white);                                           // ball
    for (let r = 0; r < 5; r++) {                                      // pegs
      const y = 11 + r * 3, off = r % 2 ? 10 : 8;
      for (let x = off; x <= 24; x += 4) R(x, y, 1, 1, C.green);
    }
    for (const x of [10, 14, 18, 22]) R(x, 24, 1, 5, C.white);         // slot dividers
    [[7, C.gold], [11, C.red], [15, C.green], [19, C.red], [23, C.gold]].forEach(([x, col]) => R(x, 27, 3, 2, col));
    R(9, 30, 3, 2, C.white); R(20, 30, 3, 2, C.white);                 // feet
  }, PLINKO, BG.plinko, [C.red, C.gold]);

  makeIcon("raidBtn", "raidIcon", (R) => {
    const pal = { W: C.white, G: C.green, Y: C.gold, R: C.red, O: C.orange };
    const rows = (arr, ox, oy, sc) => arr.forEach((row, j) => [...row].forEach((ch, i) => { if (ch !== ".") R(ox + i * sc, oy + j * sc, sc, sc, pal[ch]); }));
    rows(RAID.art.foe, 7, 1, 2);
    rows(RAID.art.small, 1, 15, 1); rows(RAID.art.small, 24, 13, 1);
    R(16, 14, 1, 3, C.white); R(16, 13, 1, 1, C.green);
    rows(RAID.art.ship, 9, 18, 2);
  }, RAID, BG.raid, [C.green, C.white]);

  makeIcon("rallyBtn", "rallyIcon", (R) => {
    R(1, 3, 30, 24, C.white); R(2, 4, 28, 22, C.black);              // little screen
    for (let y = 5; y < 25; y += 3) R(16, y, 1, 2, C.dim);            // net
    R(4, 8, 2, 8, C.white); R(26, 13, 2, 8, C.green);                 // paddles
    R(19, 10, 2, 2, C.white); R(15, 12, 1, 1, C.grey); R(11, 14, 1, 1, C.dim);  // ball and trail
    R(12, 27, 8, 2, C.white); R(8, 29, 16, 2, C.white);              // stand
  }, RALLY, BG.rally, [C.white, C.dim]);

  makeIcon("hockeyBtn", "hockeyIcon", (R) => {
    for (let i = 0; i < 18; i++) R(26 - i * .6 | 0, 2 + i, 2, 1, "#c9b48a"); // shaft
    R(25, 2, 3, 3, C.black);                                          // grip
    R(4, 20, 12, 3, C.white); R(8, 20, 3, 3, C.gold);                 // blade with tape
    R(18, 23, 11, 1, C.grey); R(17, 24, 13, 3, "#111511"); R(18, 27, 11, 1, C.grey); R(19, 28, 9, 1, "#1a1d1a"); // puck
    R(20, 24, 3, 1, C.white);
    R(2, 25, 4, 1, C.dim); R(1, 27, 6, 1, C.dim); R(3, 29, 3, 1, C.dim);   // motion lines
  }, HOCKEY, BG.hockey, [C.red, C.white]);

  makeIcon("rouletteBtn", "rouletteIcon", (R) => ROULETTE.paintIcon(R), ROULETTE, BG.roulette, [C.gold, C.red], true, (ix, px, py, s) => {
    const a = performance.now() / 1000 * .9; // the ball slowly circles the wheel
    ix.fillStyle = C.white;
    ix.fillRect(Math.round(px + (15.5 + Math.cos(a) * 11) * s - s), Math.round(py + (15.5 + Math.sin(a) * 11) * s - s), Math.ceil(2 * s), Math.ceil(2 * s));
  });

  // ---- Boot ----
  let rz = 0;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { buildWarp(); if (!gameEl.hidden) layout(); }, 150); });
  placeTitleStars();
  buildWarp();
  skies.forEach((s) => s.resize());
  if (!reduced) skyTick();
})();
</script>
</body>
</html>
