<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Globe's Arcade: six retro 8-bit browser games on a curved CRT screen.">
<title>Globe's Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Audiowide&family=Creepster&family=Metal+Mania&family=Nosifer&family=Rubik+Glitch&family=VT323&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<style>
*, *::before, *::after { box-sizing: border-box; }
body, h1, h2, p, ul { margin: 0; }
[hidden] { display: none !important; }

/* Layout: one curved TV tube fills the window. A pixel galaxy sits behind the header and the footer,
   the game slots sit on plain black between them. Games open in a full-tube overlay. Single dark look on purpose. */
:root {
  color-scheme: dark;
  --black: #000;
  --tube: #020302;        /* dead glass around the picture */
  --white: #f4f7f2;
  --green: #39ff7a;       /* phosphor green */
  --green-dim: #1c8a44;
  --green-deep: #0b3d1f;
  --red: #ff3d3d;         /* lives */
  --gold: #ffd23f;        /* winner */
  --orange: #ff8a1f;      /* explosions */
  --display: "Audiowide", "Arial Black", sans-serif;
  --mono: "VT323", "Courier New", monospace;
}
html, body { height: 100%; overflow: hidden; background: var(--tube); color: var(--white); }
/* An arcade, not a document: no text selection, callout menu or double-tap zoom when tapping fast. */
html { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
body { font: 1.35rem/1.35 var(--mono); }
button { font: inherit; }
:focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
.defs { position: absolute; width: 0; height: 0; }

/* ---------- Tube ---------- */
.crt { position: fixed; inset: 0; overflow: hidden; border-radius: 4vmin; background: var(--black); }
.crt.warp { filter: url(#warp); }
.scan, .vig { position: absolute; inset: 0; pointer-events: none; z-index: 5; border-radius: inherit; }
/* Bright line, then a darker line in between: the box TV look */
.scan { background: repeating-linear-gradient(180deg, rgba(255, 255, 255, .035) 0 2px, rgba(0, 0, 0, .42) 2px 4px); }
.vig { box-shadow: inset 0 0 16vmin rgba(0, 0, 0, .85), inset 0 0 3vmin rgba(0, 0, 0, .7); }
#flash { position: absolute; inset: 0; z-index: 6; background: var(--white); opacity: 0; pointer-events: none; }
#flash.go { animation: flash .34s steps(1, end); }
@keyframes flash { 0% { opacity: .95; } 34% { opacity: .5; } 67% { opacity: .18; } 100% { opacity: 0; } }
.scroll {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; outline: none;
  scrollbar-width: thin; scrollbar-color: var(--green-dim) transparent;
  display: flex; flex-direction: column;
}
.wrap {
  position: relative; width: 100%; max-width: 1040px; margin-inline: auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.sky { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }

/* ---------- Header ---------- */
header { position: relative; padding-block: clamp(90px, 16vh, 150px) clamp(44px, 8vh, 80px); text-align: center; }
.title-box { position: relative; display: inline-block; padding: 12px 18px; max-width: 100%; }
h1 {
  font: clamp(2rem, 8.4vw, 5.6rem)/1.05 var(--display); letter-spacing: .03em; text-wrap: balance;
  color: var(--white);
  text-shadow: 4px 4px 0 var(--green-dim), 0 0 18px rgba(57, 255, 122, .45);
}
.pstar { position: absolute; width: 21px; height: 21px; pointer-events: none; animation: blink var(--d, 6s) steps(1, end) infinite; animation-delay: var(--delay, 0s); }
.pstar svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
.pstar.sm { width: 12px; height: 12px; }
@keyframes blink {
  0% { opacity: 1; transform: scale(1); }
  25% { opacity: .55; transform: scale(.6); }
  50% { opacity: 0; transform: scale(.6); }
  75% { opacity: .55; transform: scale(.6); }
}

/* ---------- Game slots ---------- */
main { padding-block: 32px 72px; background: var(--black); }
.label { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; color: var(--green); letter-spacing: .14em; text-transform: uppercase; font-size: 1.25rem; }
.label span:last-child { color: var(--white); opacity: .7; }
.slots { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(16px, 2.6vw, 28px); }
.slot {
  position: relative; aspect-ratio: 4 / 3; max-width: 100%;
  border: 3px solid var(--white); background: var(--black);
  box-shadow: 5px 5px 0 var(--green-deep);
}
.slot b { position: absolute; left: 10px; top: 6px; font-weight: 400; color: var(--green-dim); letter-spacing: .1em; font-variant-numeric: tabular-nums; pointer-events: none; }
.slot-btn ~ b, .slot-btn .name { background: var(--black); padding-inline: 5px; line-height: 1.1; }
.slot-btn ~ b { color: var(--green); }
.slot-btn {
  position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; cursor: pointer;
  display: grid; place-items: center; background: none; border: 0; color: inherit;
}
.slot-btn canvas { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.slot-btn .name { position: absolute; left: 10px; bottom: 6px; color: var(--green); letter-spacing: .14em; }
.slot:has(.slot-btn:hover) { border-color: var(--green); }
@media (max-width: 640px) { .slots { grid-template-columns: 1fr; } }

/* ---------- Footer ---------- */
footer { position: relative; margin-top: auto; border-top: 3px solid var(--white); padding-block: 34px 54px; }
footer .wrap { display: flex; flex-wrap: wrap; gap: 12px 32px; align-items: center; justify-content: space-between; }
footer .brand { font: 1.1rem/1 var(--display); color: var(--green); letter-spacing: .04em; }
footer ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; }
footer a { color: var(--white); text-decoration: none; }
footer a:hover { color: var(--green); }
footer p { color: var(--white); opacity: .65; }

/* ---------- Game overlay ---------- */
#game { position: absolute; inset: 0; z-index: 4; background: var(--black); touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
#pin { position: absolute; left: 0; top: 0; image-rendering: pixelated; touch-action: none; }
#exit {
  position: absolute; z-index: 1; cursor: pointer; min-height: 36px; padding: 2px 12px;
  top: calc(5vmin + env(safe-area-inset-top, 0px)); right: calc(5vmin + env(safe-area-inset-right, 0px));
  background: var(--black); color: var(--white); border: 2px solid var(--white); letter-spacing: .1em;
}
#exit:hover { color: var(--green); border-color: var(--green); }
#exit.left { right: auto; left: calc(5vmin + env(safe-area-inset-left, 0px)); }
#exit.troll { right: auto; color: var(--red); border-color: var(--red); box-shadow: 3px 3px 0 #5a0d0d; }
#exit.troll:hover { color: var(--white); border-color: var(--white); }
#exit.appear { animation: exitPop .3s steps(3, end); }
@keyframes exitPop { 0% { transform: scale(.3); } 34% { transform: scale(1.25); } 67% { transform: scale(.9); } 100% { transform: none; } }
.prompt {
  position: absolute; z-index: 2; left: 50%; transform: translateX(-50%); width: min(calc(100% - 32px), 380px);
  bottom: calc(7vmin + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 8px; padding: 10px 12px 12px; text-align: center;
  background: var(--black); border: 3px solid var(--white); box-shadow: 5px 5px 0 var(--green-deep);
}
.prompt.pop { animation: pop .25s steps(3, end); }
@keyframes pop { 0% { transform: translateX(-50%) scale(.4); } 34% { transform: translateX(-50%) scale(1.08); } 67% { transform: translateX(-50%) scale(.97); } 100% { transform: translateX(-50%); } }
.p-title { color: var(--green); letter-spacing: .14em; font-size: 1.4rem; line-height: 1.1; }
.p-note { font-size: 1.1rem; line-height: 1.15; opacity: .85; text-wrap: balance; }
.p-btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.p-btns.grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.p-btns.grid .wide { grid-column: span 3; }
.p-btns button {
  min-height: 40px; min-width: 44px; padding: 2px 10px; cursor: pointer; letter-spacing: .06em;
  background: var(--black); color: var(--white); border: 2px solid var(--white);
}
.p-btns button:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
.p-btns button.red { background: #b81c1c; border-color: #ff7b7b; }
.p-btns button.black { background: #141414; }
.p-btns button.green { background: #0f7a35; border-color: var(--green); }
.p-btns button.gold { color: var(--gold); border-color: var(--gold); }
.p-btns button.red:hover:not(:disabled), .p-btns button.black:hover:not(:disabled), .p-btns button.green:hover:not(:disabled) { color: var(--white); border-color: var(--gold); }
.p-btns button:disabled { opacity: .3; cursor: default; }
#hint {
  position: absolute; left: 0; right: 0; bottom: calc(4vmin + env(safe-area-inset-bottom, 0px)); text-align: center;
  color: var(--green); font-size: 1.1rem; letter-spacing: .06em; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- The vault (hidden game) ---------- */
#vaultStar {
  position: absolute; z-index: 2; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 30px; height: 30px;
  padding: 0; border: 0; background: none; color: var(--green); cursor: pointer; filter: drop-shadow(0 0 6px rgba(57, 255, 122, .75));
}
#vaultStar svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
#vaultStar.appear { animation: exitPop .35s steps(3, end); }
#vault { position: absolute; inset: 0; z-index: 4; background: var(--black); touch-action: none; user-select: none; -webkit-user-select: none; }
#vaultCv { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
#starFx { position: absolute; inset: 0; z-index: 4; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none; }
#vpad, #hpad {
  position: absolute; left: 0; right: 0; bottom: calc(6vmin + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; gap: 12px;
  /* the arrows sit in from the curved corner of the screen, where a thumb rests comfortably */
  padding-left: max(7vw, 26px, env(safe-area-inset-left, 0px)); padding-right: max(4vw, 18px, env(safe-area-inset-right, 0px));
}
#vpad div, #hpad div { display: flex; gap: 12px; }
#vpad button, #hpad button {
  width: clamp(66px, 18vw, 96px); height: clamp(64px, 10vh, 88px); padding: 0; background: rgba(0, 0, 0, .55); color: var(--white); border: 3px solid var(--white);
  font-size: 1.6rem; letter-spacing: .08em; touch-action: none;
}
#vpad button[data-k="l"], #vpad button[data-k="r"], #hpad button[data-k="l"], #hpad button[data-k="r"] { font-size: 2.4rem; line-height: 1; }
#vpad button.held, #hpad button.held { background: var(--white); color: var(--black); }
#hpad { z-index: 2; }
#hpad button { border-color: #a00000; color: #ff6b6b; }

/* ---------- The pimple (Plinko's hidden horror game) ---------- */
#hMsg {
  position: absolute; inset: 0; z-index: 3; margin: 0; display: grid; place-items: center; text-align: center; pointer-events: none;
  padding-left: max(6vw, 16px); padding-right: max(6vw, 16px);
  font: clamp(30px, 7.5vw, 84px)/1.15 "Metal Mania", "Creepster", serif; color: #a30000;
  text-shadow: 0 0 18px rgba(255, 0, 0, .55), 3px 3px 0 #2a0000; opacity: 0;
}
#hMsg.on { opacity: 1; transition: opacity 1s steps(6, end); animation: hShake .2s steps(2, end) infinite; }
#hMsg.fade { opacity: 0; transition: opacity 2.5s linear; }
@keyframes hShake { 0% { transform: translate(0, 0) skewX(0); } 50% { transform: translate(1px, -1px) skewX(-1.5deg); } }
#hBubble {
  position: absolute; z-index: 3; margin: 0; max-width: min(72vw, 430px); padding: 8px 12px; text-align: center; pointer-events: none;
  transform: translate(-50%, -100%); background: #050505; border: 2px solid #cfcfcf; color: #e4e4e4;
  font: clamp(18px, 3.4vw, 28px)/1.15 "Creepster", serif; letter-spacing: .04em; animation: hShake .3s steps(2, end) infinite;
}
#hBubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -6px; border: 6px solid transparent; border-top-color: #cfcfcf; }
#hBubble.boss { border-color: #7a0000; color: #c40000; font: clamp(14px, 2.6vw, 22px)/1.3 "Nosifer", "Creepster", serif; text-shadow: 0 0 8px rgba(255, 0, 0, .6); }
#hBubble.boss::after { border-top-color: #7a0000; }
#hBubble.glitch {
  border-color: #ff1a1a; color: #ff2a2a; font: clamp(15px, 2.8vw, 24px)/1.25 "Rubik Glitch", "VT323", monospace; letter-spacing: .02em;
  text-shadow: 2px 0 rgba(0, 255, 255, .55), -2px 0 rgba(255, 0, 255, .45); animation: hGlitch .35s steps(3, end) infinite;
}
#hBubble.glitch::after { border-top-color: #ff1a1a; }
@keyframes hGlitch { 0% { transform: translate(-50%, -100%); } 33% { transform: translate(calc(-50% + 2px), -100%) skewX(4deg); } 66% { transform: translate(calc(-50% - 1px), calc(-100% + 1px)); } }
#hMsg.plain { font: clamp(22px, 4vw, 40px)/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #ffffff; text-shadow: none; letter-spacing: 0; }
#hMsg.plain.on { animation: none; }
/* ---------- The depths (first-person) ---------- */
#depths { position: absolute; inset: 0; z-index: 4; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
#dCv, #dHi { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#dCv { image-rendering: pixelated; }
#dHi { pointer-events: none; }
#dPause {
  position: absolute; z-index: 2; top: calc(5vmin + env(safe-area-inset-top, 0px)); right: calc(5vmin + env(safe-area-inset-right, 0px));
  min-width: 46px; min-height: 42px; background: rgba(0, 0, 0, .5); color: #ff6b6b; border: 2px solid #a00000; font-size: 1.4rem; letter-spacing: .12em; cursor: pointer;
}
#dUse {
  position: absolute; z-index: 2; right: calc(8vw + env(safe-area-inset-right, 0px)); bottom: calc(12vmin + env(safe-area-inset-bottom, 0px));
  width: 84px; height: 84px; border-radius: 50%; background: rgba(160, 0, 0, .35); color: #ffd0d0; border: 3px solid #ff6b6b; font-size: 1.5rem; letter-spacing: .08em;
}
#dStick {
  position: absolute; z-index: 2; left: calc(7vw + env(safe-area-inset-left, 0px)); bottom: calc(8vmin + env(safe-area-inset-bottom, 0px));
  width: clamp(110px, 30vmin, 170px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; pointer-events: none;
  border: 2px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .06);
}
#dKnob { width: 42%; aspect-ratio: 1; border-radius: 50%; background: rgba(255, 255, 255, .22); border: 2px solid rgba(255, 255, 255, .45); }
#dMenu { position: absolute; inset: 0; z-index: 3; display: grid; place-content: center; gap: 12px; text-align: center; background: rgba(10, 0, 0, .74); }
#dMenu p { margin: 0 0 8px; color: #c81e1e; font: 2.4rem/1 var(--display); letter-spacing: .12em; }
#dMenu button { min-width: 200px; min-height: 48px; background: #000; color: #ff6b6b; border: 2px solid #a00000; font-size: 1.5rem; letter-spacing: .14em; cursor: pointer; }
#dMenu button:hover { color: #fff; border-color: #ff6b6b; }
/* the 7th box */
.slot.cursed { border-color: var(--red); box-shadow: 5px 5px 0 #3a0808; }
.slot.cursed .slot-btn .name, .slot.cursed .slot-btn ~ b { color: var(--red); }
.slot.cursed:has(.slot-btn:hover) { border-color: #ff8a8a; }
.slot.appear { animation: exitPop .4s steps(3, end); }

@media (prefers-reduced-motion: reduce) { .pstar { animation: none; } }
</style>

<svg class="defs" aria-hidden="true">
  <filter id="warp" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="warpMap" x="0" y="0" width="100%" height="100%" preserveAspectRatio="none" result="map"/>
    <feDisplacementMap id="warpDisp" in="SourceGraphic" in2="map" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="crt" id="crt">
  <div class="scroll" id="scroll" tabindex="0">
    <header id="top">
      <canvas class="sky" id="skyTop" aria-hidden="true"></canvas>
      <div class="wrap">
        <div class="title-box" id="titleBox">
          <h1>Globe's Arcade</h1>
        </div>
      </div>
    </header>

    <main>
      <div class="wrap">
        <p class="label"><span>Select a game</span><span>6 slots</span></p>
        <ul class="slots" aria-label="Games">
          <li class="slot">
            <button class="slot-btn" id="pinballBtn" type="button" aria-label="Play Pinball">
              <canvas id="pinIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">PINBALL</span>
            </button>
            <b>01</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="plinkoBtn" type="button" aria-label="Play Plinko">
              <canvas id="plinkoIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">PLINKO</span>
            </button>
            <b>02</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="raidBtn" type="button" aria-label="Play Star Raid">
              <canvas id="raidIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">STAR RAID</span>
            </button>
            <b>03</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="rallyBtn" type="button" aria-label="Play Rally">
              <canvas id="rallyIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">RALLY</span>
            </button>
            <b>04</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="hockeyBtn" type="button" aria-label="Play Air Hockey">
              <canvas id="hockeyIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">AIR HOCKEY</span>
            </button>
            <b>05</b>
          </li>
          <li class="slot">
            <button class="slot-btn" id="rouletteBtn" type="button" aria-label="Play Roulette. Tap three times to break the glass.">
              <canvas id="rouletteIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">ROULETTE</span>
            </button>
            <b>06</b>
          </li>
          <li class="slot cursed" id="slot7" hidden>
            <button class="slot-btn" id="cursedBtn" type="button" aria-label="A red question mark">
              <canvas id="cursedIcon" width="64" height="48" aria-hidden="true"></canvas>
              <span class="name">???</span>
            </button>
            <b>07</b>
          </li>
        </ul>
      </div>
    </main>

    <footer id="foot">
      <canvas class="sky" id="skyBot" aria-hidden="true"></canvas>
      <button id="vaultStar" type="button" hidden aria-label="A solid green star"><svg viewBox="0 0 7 7" aria-hidden="true"><path fill="currentColor" d="M3 0h1v2h-1zM3 5h1v2h-1zM0 3h2v1h-2zM5 3h2v1h-2zM2 2h3v3h-3z"/></svg></button>
      <div class="wrap">
        <span class="brand">Globe's Arcade</span>
        <ul>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
          <li><a href="#">Credits</a></li>
        </ul>
        <p>Footer placeholder. &copy; 2026</p>
      </div>
    </footer>
  </div>

  <div id="game" hidden tabindex="-1" role="application" aria-label="Pinball">
    <canvas id="pin" aria-hidden="true"></canvas>
    <button id="exit" type="button" hidden>EXIT</button>
    <p id="hint" hidden></p>
    <p id="hMsg" hidden></p>
    <p id="hBubble" hidden></p>
    <div id="hpad" hidden>
      <div><button type="button" data-k="l" aria-label="Move left">&lt;</button><button type="button" data-k="r" aria-label="Move right">&gt;</button></div>
      <div><button type="button" data-k="duck">DUCK</button><button type="button" data-k="jump">JUMP</button></div>
    </div>
    <div id="prompt" class="prompt" hidden aria-live="polite">
      <p class="p-title" id="pTitle"></p>
      <p class="p-note" id="pNote"></p>
      <div class="p-btns" id="pBtns"></div>
    </div>
  </div>

  <div id="vault" hidden role="application" aria-label="Hidden game">
    <canvas id="vaultCv" aria-hidden="true"></canvas>
    <div id="vpad" hidden>
      <div><button type="button" data-k="l" aria-label="Move left">&lt;</button><button type="button" data-k="r" aria-label="Move right">&gt;</button></div>
      <div><button type="button" data-k="duck">DUCK</button><button type="button" data-k="jump">JUMP</button></div>
    </div>
  </div>
  <div id="depths" hidden role="application" aria-label="First-person game">
    <canvas id="dCv" aria-hidden="true"></canvas>
    <canvas id="dHi" aria-hidden="true"></canvas>
    <button id="dPause" type="button" aria-label="Pause">II</button>
    <button id="dUse" type="button" hidden>USE</button>
    <div id="dStick" hidden><i id="dKnob"></i></div>
    <div id="dMenu" hidden>
      <p>PAUSED</p>
      <button id="dResume" type="button">RESUME</button>
      <button id="dLeave" type="button">LEAVE</button>
    </div>
  </div>
  <canvas id="starFx" hidden aria-hidden="true"></canvas>
  <div class="scan"></div>
  <div class="vig"></div>
  <div id="flash"></div>
</div>

<script>
(() => {
  const CONFIG = {
    curve: 0.07,        // screen curvature
    px: 3,              // size of one galaxy pixel in CSS pixels
    fps: 8,             // galaxy frame rate (star blinks, Saturn's ring)
    cometFps: 14,       // galaxy frame rate while a comet is crossing
    cometEvery: 30,     // seconds between comets
    animFps: 12,        // game open and close animations
    playFps: 30,        // pinball while playing
    lives: 4,
    winScore: 5000,     // Plinko points needed for the WINNER screen
    showSecretBox: false, // true shows the 7th (?) box from the start, for testing
  };
  const $ = (id) => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const C = { white: css("--white"), green: css("--green"), dim: css("--green-dim"), deep: css("--green-deep"), red: css("--red"), gold: css("--gold"), orange: css("--orange"), amber: "#fff3a0", ember: "#5a2a08", black: "#000", grey: "#8b938a", dark: "#3c423b" };
  const crt = $("crt");
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };

  // ---- Curved glass: an SVG displacement map bends the whole tube ----
  const safari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  let warpK = CONFIG.curve;
  function buildWarp() {
    if (safari) return; // Safari's url() filters are unreliable on HTML; it keeps the rounded tube and vignette.
    const W = innerWidth, H = innerHeight, N = 256, MH = Math.max(32, Math.round(N * H / W));
    const scale = 2 * Math.max(W, H) * warpK * 0.55;
    const c = mk(N, MH), x = c.getContext("2d"), img = x.createImageData(N, MH);
    for (let j = 0, i = 0; j < MH; j++) for (let k = 0; k < N; k++, i += 4) {
      const px = (k + .5) / N * 2 - 1, py = (j + .5) / MH * 2 - 1;
      img.data[i] = 127.5 + 255 * (px * warpK * py * py * W / 2) / scale;
      img.data[i + 1] = 127.5 + 255 * (py * warpK * px * px * H / 2) / scale;
      img.data[i + 2] = 128; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    $("warpMap").setAttribute("href", c.toDataURL());
    $("warpDisp").setAttribute("scale", scale);
    crt.classList.add("warp");
  }

  // ---- 8-bit stars hugging the title ----
  const STAR = `<svg viewBox="0 0 7 7"><path fill="currentColor" d="M3 0h1v2h-1zM3 5h1v2h-1zM0 3h2v1h-2zM5 3h2v1h-2zM2 2h3v3h-3z"/></svg>`;
  function placeTitleStars() {
    const box = $("titleBox");
    // Spots just outside the letters, as % of the title box.
    const spots = [[-1, 8], [38, -10], [100, 2], [93, 104], [16, 100]];
    spots.forEach(([l, t], i) => {
      const s = document.createElement("i");
      s.className = "pstar" + (i % 2 ? " sm" : "");
      s.innerHTML = STAR;
      s.style.left = `calc(${l}% - 10px)`; s.style.top = `calc(${t}% - 10px)`;
      s.style.color = i % 3 === 0 ? C.green : C.white;
      s.style.setProperty("--d", (4.8 + (i * 37 % 10) * .6).toFixed(2) + "s");
      s.style.setProperty("--delay", (-(i * 53 % 17) * .45).toFixed(2) + "s");
      box.appendChild(s);
    });
  }

  // ---- Pixel galaxy behind the header and the footer ----
  let spin = 0;
  function makeSky(canvas, host, opts) {
    const s = { canvas, host, g: canvas.getContext("2d"), w: 0, h: 0, stars: [], comet: null, next: 0, sat: null, planet: null, ...opts };
    s.resize = () => {
      s.w = Math.max(1, Math.ceil(host.clientWidth / CONFIG.px)); s.h = Math.max(1, Math.ceil(host.clientHeight / CONFIG.px));
      canvas.width = s.w; canvas.height = s.h;
      const n = Math.min(90, Math.max(10, Math.round(s.w * s.h / 1260)));
      s.stars = Array.from({ length: n }, () => ({
        x: Math.floor(Math.random() * s.w), y: Math.floor(Math.random() * s.h),
        big: Math.random() < .14, green: Math.random() < .22,
        period: (6 + Math.floor(Math.random() * 18)) * 4, phase: Math.floor(Math.random() * 96),
      }));
      if (s.saturn) {
        const r = Math.max(7, Math.min(14, Math.round(Math.min(s.w * .03, s.h * .13))));
        s.sat = { r, x: s.w - Math.round(r * 2.5) - 6, y: Math.round(r * 1.5) + 8, tilt: -.38 };
        s.sat.pal = SAT.state === "red" ? PAL_R : PAL_G;
        s.planet = paintPlanet(r, s.sat.tilt, s.sat.pal);
      }
      s.draw(performance.now() / 1000);
    };
    s.draw = (t) => {
      const g = s.g;
      g.fillStyle = C.black; g.fillRect(0, 0, s.w, s.h);
      const f = Math.floor(t * CONFIG.fps);
      for (const st of s.stars) {
        const step = (f + st.phase) % st.period;   // each star blinks on its own slow beat
        if (!reduced && step < 8) continue;         // off
        const dim = !reduced && step < 16;
        g.fillStyle = dim ? (st.green ? C.deep : "#5a6157") : (st.green ? C.green : C.white);
        g.fillRect(st.x, st.y, 1, 1);
        if (st.big && !dim) { g.fillRect(st.x - 1, st.y, 3, 1); g.fillRect(st.x, st.y - 1, 1, 3); }
      }
      if (s.comet) drawComet(s, t);
      if (s.sat && (SAT.state === "alive" || SAT.state === "red")) {
        drawRing(s, false);
        g.drawImage(s.planet, s.sat.x - s.sat.r, s.sat.y - s.sat.r);
        drawRing(s, true);
      }
      if (s.sat && SAT.state === "boom") drawBoom(s, t);
    };
    return s;
  }

  // Saturn palettes: green on the website, red inside the vault (and on the website once you have died in there).
  const PAL_G = { band: [C.green, C.dim, "#7dffad", C.dim, C.green, C.deep], deep: C.deep, ring: [C.white, C.green, C.dim, C.deep] };
  const PAL_R = { band: ["#ff3d3d", "#8a1a1a", "#ff8a8a", "#8a1a1a", "#ff3d3d", "#3a0808"], deep: "#3a0808", ring: ["#ffd0d0", "#ff3d3d", "#8a1a1a", "#3a0808"] };
  // alive: green, clickable. boom: exploding. gone: exploded, the footer star is out. red: you died in the vault, no way back in.
  const SAT = { state: "alive", parts: [], t0: 0 };
  // Rewards that stay on the little blue player until it dies: a white aura (beat Jon) and a crown (beat Lucifugus).
  let AURA = false, CROWN = false;
  function playerDied() { AURA = false; CROWN = false; }
  function auraBack(x, px0, top, h) { // a soft white glow with wisps rising off it
    if (!AURA) return;
    const t = performance.now() / 1000;
    x.globalAlpha = .22 + .06 * Math.sin(t * 5); x.fillStyle = "#ffffff";
    x.beginPath(); x.ellipse(px0 + 3, top + h / 2, 6, h / 2 + 3, 0, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;
    for (let k = 0; k < 9; k++) {
      const up = (t * 26 + k * 7) % (h + 6), wx = px0 + ((k * 5) % 9) - 1.5 + Math.sin(t * 6 + k) * .8;
      x.fillStyle = k % 3 ? "#ffffff" : "#bfe4ff"; x.fillRect(Math.round(wx), Math.round(top + h - up), 1, 2);
    }
  }
  function crownOn(x, px0, top) { // a small gold crown with a red gem
    if (!CROWN) return;
    const X = Math.round(px0), Y = Math.round(top) - 3;
    x.fillStyle = "#ffd23f"; x.fillRect(X, Y + 1, 6, 2); x.fillRect(X, Y, 1, 1); x.fillRect(X + 2, Y - 1, 2, 1); x.fillRect(X + 5, Y, 1, 1);
    x.fillStyle = "#c81e1e"; x.fillRect(X + 2, Y + 1, 2, 1);
  }

  // Saturn's body is drawn once: banded colours with a dithered shadow.
  function paintPlanet(r, tilt, pal = PAL_G) {
    const c = mk(r * 2 + 1, r * 2 + 1), x = c.getContext("2d"), band = pal.band;
    const cos = Math.cos(-tilt), sin = Math.sin(-tilt);
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      if (i * i + j * j > r * r + r * .4) continue;
      const lat = (i * sin + j * cos) / r;
      const z = Math.sqrt(Math.max(0, 1 - (i * i + j * j) / (r * r)));
      const light = (-i * .55 - j * .45) / r + z * .8;
      let col = band[Math.floor((lat + 1) * 3.4) % band.length];
      if (light < .15 && (i + j) % 2 === 0) col = pal.deep;
      if (light < -.15) col = (i + j) % 2 === 0 ? C.black : pal.deep;
      x.fillStyle = col; x.fillRect(i + r, j + r, 1, 1);
    }
    return c;
  }
  // The ring is dots on tilted ellipses. Bright clumps travel around it as it spins.
  function ringOn(g, sat, front, sp) {
    const { r, x: cx, y: cy, tilt } = sat, ct = Math.cos(tilt), st = Math.sin(tilt), rc = (sat.pal || PAL_G).ring;
    [1.42, 1.56, 1.7, 1.82, 2.04, 2.16, 2.26].forEach((k, ri) => {
      const R = r * k, steps = Math.ceil(Math.PI * 2 * R * 1.4);
      for (let i = 0; i < steps; i++) {
        const a = i / steps * Math.PI * 2, ly = Math.sin(a);
        if ((ly > 0) !== front) continue;
        const ex = Math.cos(a) * R, ey = ly * R * .3;
        const b = Math.sin(3 * (a - sp) + ri) + .6 * Math.sin(8 * (a - sp) + ri * 2);
        g.fillStyle = b > .9 ? rc[0] : b > -.2 ? (ri < 4 ? rc[1] : rc[2]) : rc[3];
        g.fillRect(Math.round(cx + ex * ct - ey * st), Math.round(cy + ex * st + ey * ct), 1, 1);
      }
    });
  }
  const drawRing = (s, front) => ringOn(s.g, s.sat, front, spin);
  // Saturn blowing up in the header: a white flash, a shock ring, then planet and ring pieces flying out.
  function boomSaturn(s) {
    const { r, x, y, tilt } = s.sat;
    SAT.state = "boom"; SAT.t0 = performance.now() / 1000; SAT.parts = [];
    for (let i = 0; i < 70; i++) {
      const a = Math.random() * Math.PI * 2, d = Math.random() * r, sp = 18 + Math.random() * 70;
      SAT.parts.push({ x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: PAL_G.band[i % 6], s: Math.random() < .3 ? 2 : 1, life: .8 + Math.random() * 1 });
    }
    for (let i = 0; i < 50; i++) {
      const a = Math.random() * Math.PI * 2, R = r * (1.4 + Math.random() * .9), ex = Math.cos(a) * R, ey = Math.sin(a) * R * .3;
      const px = x + ex * Math.cos(tilt) - ey * Math.sin(tilt), py = y + ex * Math.sin(tilt) + ey * Math.cos(tilt), sp = 25 + Math.random() * 60;
      SAT.parts.push({ x: px, y: py, vx: (px - x) / R * sp, vy: (py - y) / R * sp, col: [C.white, C.green, C.dim][i % 3], s: 1, life: .6 + Math.random() * 1.1 });
    }
    for (let i = 0; i < 24; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 60;
      SAT.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, col: [C.gold, C.orange, C.amber][i % 3], s: 1, life: .4 + Math.random() * .4 });
    }
  }
  function drawBoom(s, t) {
    const g = s.g, e = t - SAT.t0, { r, x, y } = s.sat;
    if (e < .1) { g.fillStyle = C.white; for (let j = -r * 2; j <= r * 2; j++) for (let i = -r * 2; i <= r * 2; i++) if (i * i + j * j < r * r * 3) g.fillRect(x + i, y + j, 1, 1); }
    if (e < .6) { // shock ring
      const R = r + e * 70, n = Math.ceil(R * 3);
      g.fillStyle = e < .25 ? C.white : C.green;
      for (let k = 0; k < n; k += 2) { const a = k / n * Math.PI * 2; g.fillRect(Math.round(x + Math.cos(a) * R), Math.round(y + Math.sin(a) * R * .8), 1, 1); }
    }
    for (const p of SAT.parts) {
      if (e > p.life) continue;
      g.fillStyle = e > p.life * .7 && (Math.floor(e * 20) % 2) ? C.deep : p.col;
      g.fillRect(Math.round(p.x + p.vx * e), Math.round(p.y + p.vy * e + 14 * e * e), p.s, p.s);
    }
    if (e > 2 && SAT.state === "boom") { SAT.state = "gone"; SAT.parts = []; showVaultStar(); }
  }
  function drawComet(s, t) {
    const g = s.g, c = s.comet, p = (t - c.start) / c.life;
    if (p >= 1) { s.comet = null; return; }
    const hx = Math.round(c.x0 + (c.x1 - c.x0) * p), hy = Math.round(c.y0 + (c.y1 - c.y0) * p);
    const dx = c.x1 - c.x0, dy = c.y1 - c.y0, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    for (let i = 1; i < 34; i++) {
      if (i > 18 && i % 2) continue;
      g.fillStyle = i < 6 ? C.white : i < 18 ? C.green : C.dim;
      g.fillRect(Math.round(hx - ux * i), Math.round(hy - uy * i), 1, 1);
    }
    g.fillStyle = C.white;
    g.fillRect(hx - 1, hy - 1, 2, 2);
    g.fillRect(hx - 3, hy, 1, 1); g.fillRect(hx + 2, hy - 1, 1, 1);
  }
  function launchComet(s, t) {
    const fromLeft = Math.random() < .5, y0 = Math.random() * s.h * .3;
    s.comet = { start: t, life: 2.4, x0: fromLeft ? -40 : s.w + 40, y0, x1: fromLeft ? s.w + 40 : -40, y1: y0 + s.h * (.3 + Math.random() * .3) };
  }

  const skies = [
    makeSky($("skyTop"), $("top"), { saturn: true, hasComet: true }),
    makeSky($("skyBot"), $("foot"), {}),
  ];
  const ro = new ResizeObserver(() => skies.forEach((s) => s.resize()));
  skies.forEach((s) => ro.observe(s.host));
  let nextComet = performance.now() / 1000 + 4; // first comet shortly after load, then every 30 seconds
  function skyTick() {
    const t = performance.now() / 1000, top = skies[0];
    if (!document.hidden && $("game").hidden && !V.active && !DEPTHS.active) {
      if (!top.comet && t >= nextComet) { launchComet(top, t); nextComet = t + CONFIG.cometEvery; }
      spin += .045;
      skies.forEach((s) => s.draw(t));
    }
    setTimeout(skyTick, 1000 / (SAT.state === "boom" ? 20 : top.comet ? CONFIG.cometFps : CONFIG.fps));
  }

  // =====================================================================
  //  SHARED GAME SCREEN: border, hearts, score, open and close sequence
  // =====================================================================

  // ---- Tiny 3x5 pixel font ----
  const FONT = {
    0: "111101101101111", 1: "010110010010111", 2: "111001111100111", 3: "111001111001111", 4: "101101111001001",
    5: "111100111001111", 6: "111100111101111", 7: "111001010010010", 8: "111101111101111", 9: "111101111001111",
    S: "111100111001111", C: "111100100100111", O: "111101101101111", R: "110101110101101", E: "111100110100111",
    G: "111100101101111", A: "010101111101101", M: "101111111101101", V: "101101101101010", L: "100100100100111",
    H: "101101111101101", B: "110101110101110", P: "110101110100100", U: "101101101101111", Y: "101101010010010",
    I: "111010010010111", T: "111010010010010", N: "110101101101101", D: "110101101101110", X: "101101010101101",
    J: "001001001101111", K: "101101110101101", W: "101101111111101", F: "111100110100100", Z: "111001010100111",
    "+": "000010111010000", "-": "000000111000000", "!": "010010010000010", "?": "111001011000010",
  };
  function text(x, str, px, py, col, s = 1) {
    x.fillStyle = col;
    let cx = px;
    for (const ch of str) {
      const gl = FONT[ch];
      if (gl) for (let i = 0; i < 15; i++) if (gl[i] === "1") x.fillRect(cx + (i % 3) * s, py + ((i / 3) | 0) * s, s, s);
      cx += 4 * s;
    }
  }
  const textW = (str, s = 1) => str.length * 4 * s - s;
  const HEART = [".RR.RR.", "RRRRRRR", "RRRRRRR", ".RRRRR.", "..RRR..", "...R..."];
  function heart(x, px, py, full) {
    HEART.forEach((row, j) => [...row].forEach((ch, i) => {
      if (ch !== "R") return;
      const edge = j === 0 || i === 0 || i === 6 || HEART[j + 1]?.[i] !== "R" || row[i - 1] !== "R" || row[i + 1] !== "R" || HEART[j - 1]?.[i] !== "R";
      if (!full && !edge) return;
      x.fillStyle = full ? (j === 1 && i === 1 ? "#ffb3b3" : C.red) : C.dark;
      x.fillRect(px + i, py + j, 1, 1);
    }));
  }
  const rect = (x, px, py, w, h, col) => { x.fillStyle = col; x.fillRect(Math.round(px), Math.round(py), Math.round(w), Math.round(h)); };
  const box = (x, px, py, w, h, col) => { rect(x, px, py, w, 1, col); rect(x, px, py + h - 1, w, 1, col); rect(x, px, py, 1, h, col); rect(x, px + w - 1, py, 1, h, col); };
  function line(x, x0, y0, x1, y1, col, t = 1) {
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0))));
    x.fillStyle = col;
    for (let i = 0; i <= n; i++) x.fillRect(Math.round(x0 + (x1 - x0) * i / n - (t - 1) / 2), Math.round(y0 + (y1 - y0) * i / n - (t - 1) / 2), t, t);
  }
  function disc(x, cx, cy, r, col, shade) {
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
      if (i * i + j * j > r * r + r * .6) continue;
      x.fillStyle = shade && i + j > r * .8 ? shade : col;
      x.fillRect(Math.round(cx) + i, Math.round(cy) + j, 1, 1);
    }
  }

  // Every game's playing area is 96 x 160 pixels, inside a border with room for the score.
  const MW = 96, MH = 160, PADX = 5, PADT = 11, PADB = 5, BW = MW + PADX * 2, BH = MH + PADT + PADB;
  const gameEl = $("game"), cv = $("pin"), gx = cv.getContext("2d"), exitBtn = $("exit"), hint = $("hint");
  const L = { u: 3, cw: 0, ch: 0, bx: 0, by: 0 };
  function layout() {
    const W = crt.clientWidth, H = crt.clientHeight;
    L.u = Math.max(2, Math.floor(Math.min(H / (BH + 36), W / (BW + 8))));
    L.cw = Math.ceil(W / L.u); L.ch = Math.ceil(H / L.u);
    cv.width = L.cw; cv.height = L.ch;
    cv.style.width = L.cw * L.u + "px"; cv.style.height = L.ch * L.u + "px";
    gx.imageSmoothingEnabled = false;
    L.bx = Math.floor((L.cw - BW) / 2); L.by = Math.floor((L.ch - BH) / 2) + 2;
  }

  const G = { state: "off", f: 0, my: 0, sil: false, shake: 0, acc: 0, last: 0, parts: [], pops: [], steam: 0,
    score: 0, lives: CONFIG.lives, blinkLo: 0, blinkHi: 0, blinkT: 0 };
  let cur = null; // the game that is open
  const go = (s) => { G.state = s; G.f = 0; G.ts = 0; exitBtn.hidden = !["play", "over", "win"].includes(s); hint.hidden = s !== "play"; };
  const addScore = (n) => { G.score = Math.min(999999, G.score + n); };
  function loseHearts(n) {
    const lost = Math.min(G.lives, n);
    G.lives -= lost; G.blinkLo = G.lives; G.blinkHi = G.lives + lost; G.blinkT = 1.1;
  }

  // ---- Physics helpers ----
  function closest(ax, ay, bx, by, px, py) {
    const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy;
    let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    return [ax + dx * t, ay + dy * t];
  }
  // Bounces ball `o` off a point. Returns 0 for no contact, 1 for a bounce, 2 for a bounce that fired a kicker.
  function hit(o, cx, cy, rad, e, vpx, vpy, kick) {
    const dx = o.x - cx, dy = o.y - cy, d2 = dx * dx + dy * dy, min = o.r + rad;
    if (d2 >= min * min) return 0;
    const d = Math.sqrt(d2) || .0001, nx = dx / d, ny = dy / d;
    o.x = cx + nx * min; o.y = cy + ny * min;
    let rx = o.vx - vpx, ry = o.vy - vpy;
    const vn = rx * nx + ry * ny;
    if (vn >= 0) return 0;
    rx -= (1 + e) * vn * nx; ry -= (1 + e) * vn * ny;
    const k = vn < -25 ? kick : 0;
    o.vx = rx + vpx + nx * k; o.vy = ry + vpy + ny * k;
    return k > 0 ? 2 : 1;
  }

  // ---- Particles ----
  function rubble(dir) { // pinball slam
    const bottom = L.by + PADT + MH, left = L.bx + PADX;
    for (let i = 0; i < 30; i++) {
      const x = left + Math.random() * MW;
      G.parts.push({ k: "bit", x, y: bottom - 1, vx: (x - (left + MW / 2)) * 1.4 + (Math.random() - .5) * 60, vy: -(60 + Math.random() * 120) * dir,
        s: Math.random() < .3 ? 2 : 1, col: [C.white, C.grey, C.green, C.dim][i % 4], gr: 320, life: 10 + Math.random() * 10 });
    }
    for (let i = 0; i < 12; i++) {
      const side = i % 2 ? 1 : -1, x = i < 4 ? left + (side > 0 ? MW : 0) : left + Math.random() * MW;
      G.parts.push({ k: "puff", x, y: bottom - 2, vx: side * (10 + Math.random() * 30), vy: -(8 + Math.random() * 18), r: 2, life: 12 + Math.random() * 6, age: 0 });
    }
  }
  function explode(cx, cy) { // plinko intro
    for (let i = 0; i < 56; i++) {
      const a = Math.PI + Math.random() * Math.PI, sp = 50 + Math.random() * 190;
      G.parts.push({ k: "bit", x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * .9,

  // =====================================================================

    }
    function drawGame(x, tx, ty) {
      rect(x, tx - 1, ty, 1, MH, C.deep); rect(x, tx + MW, ty, 1, MH, C.deep);
      for (let i = 0; i < MW; i += 6) rect(x, tx + i + 1, ty + 80, 3, 1, C.dim);

      for (let i = 0; i < N; i++) {
        for (let r = 0; r < depth; r++) { const [a, b] = [pts[i][r], pts[i][r + 1]]; line(x, a[0] + 1, a[1] + 1, b[0] + 1, b[1] + 1, C.grey); line(x, a[0], a[1], b[0], b[1], C.white); }

    return {
      name: "AIR HOCKEY",
      lives: CONFIG.lives,
      hint: { touch: "Drag to move your mallet.", keys: "Move your mallet with the mouse or the arrow keys. Esc exits." },
      keys: ["ArrowLeft", "KeyA", "ArrowRight", "KeyD", "ArrowUp", "KeyW", "ArrowDown", "KeyS"],
      animRate: () => (G.state === "enter" || G.state === "leave") ? 30 : CONFIG.animFps,
      reset() {

        mtx = 48; mty = 136; endState = null; endT = 0; goalT = 0; hits = 0; yellow = false; power = 0; this.stop(); place(1); resetT = 0;
      },
      stop() { held.l = held.r = held.u = held.d = false; },
      update(dt) {
        const kx = (held.r ? 1 : 0) - (held.l ? 1 : 0), ky = (held.d ? 1 : 0) - (held.u ? 1 : 0);
        if (kx || ky) { mtx += kx * 130 * dt; mty += ky * 130 * dt; }

          sp = 88 + G.score / 100 * 7;

  // ---- Open and close sequence (12 frames a second) ----

      case "open": if (f >= 6) { go("enter"); cur.enter(0); } break;
      case "enter": if (cur.enter(f)) go("settle"); break;
      case "settle": if (f >= 10) { go("play"); gameEl.focus({ preventScroll: true }); } break;
      case "over": if (f >= 24) { go("leave"); cur.leave(0); } break;
      case "win": if (f % 5 === 1 && f < 22) confetti(); if (f >= (cur.winFrames || 36)) { go("leave"); cur.leave(0); } break;
      case "leave": if (cur.leave(f)) go("close"); break;
      case "close": if (f >= 6) go("unline"); break;

  // around outside the border. 3rd press: you are out.

  function btnBits(kind) { // particles where the button is, in game pixels

    useBtn.addEventListener("click", (e) => { e.stopPropagation(); use(); });
    pauseBtn.addEventListener("click", (e) => { e.stopPropagation(); setPaused(!paused); });
    $("dResume").addEventListener("click", () => { setPaused(false); });
    $("dLeave").addEventListener("click", () => leave());

    function enter() {
      gameEl.hidden = true; G.state = "off";
      warpK = CONFIG.curve / 2; buildWarp();
      active = true; paused = false; menu.hidden = true; root.hidden = false; stick.hidden = !touch; pauseBtn.hidden = false;
      quality = 0; frameAvg = 16; size();
      Object.assign(P, { x: 4.5, y: 19.5, a: -Math.PI / 2, hp: 3, inv: 0, dead: 0 });
      doorOpen = 0; doorMoving = false; btnPressed = false; roseState = "idle"; roseT = 0; petals = []; parts = []; jon = null; clone = null; spikes = []; beams = [];
      orbs = []; shots = []; whiteOrb = null; whiteOut = 0; gore = []; fightStarted = false;
      tall = { x: 12.5, y: 18.5, path: [], chase: 0, repath: 0, step: 0 };
      T = 0; fadeIn = 0;
      last = performance.now(); raf = requestAnimationFrame(frame);
    }
    function leave() {
      active = false; cancelAnimationFrame(raf);
      if (document.pointerLockElement) document.exitPointerLock?.();
      root.hidden = true; menu.hidden = true;
      hctx.clearRect(0, 0, hi.width, hi.height);
      warpK = CONFIG.curve; buildWarp();
      flash();
      STRANGER.icon.anim(true);
    }
    addEventListener("resize", () => { if (active) size(); });
    return { enter, get active() { return active; } };
  })();


  // ---- Boot ----
  let rz = 0;
  addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { buildWarp(); if (!gameEl.hidden) layout(); }, 150); });
  placeTitleStars();
  buildWarp();
  skies.forEach((s) => s.resize());
  if (!reduced) skyTick();
})();
</script>
</body>
